<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEO FF PANEL</title>
<style>
body {
  background: #101018;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}
.panel {
  background: #20202c;
  padding: 20px;
  border-radius: 15px;
}
h1 { color: #00ff99; }
input { width: 90%; accent-color: #00ff99; }
button {
  background: #00cc88;
  padding: 14px;
  margin: 8px;
  border: 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<div class="panel">
<h1>LEO FF PANEL</h1>
<p>SAFE COMPANION DASHBOARD</p>

<h3>General Sensitivity</h3>
<input type="range" min="0" max="200" value="100">

<h3>Red Dot Sensitivity</h3>
<input type="range" min="0" max="200" value="90">

<h3>2X Scope Sensitivity</h3>
<input type="range" min="0" max="200" value="80">

<button onclick="location.reload()">RESET</button>
<p>LEO PANEL ACTIVE</p>
<p>Reference settings only — no automatic game control.</p>
</div>
</body>
</html>
